name: Publish Obsidian Plugin
on:
  workflow_run:
    workflows: ["Plugin CI", "Integration bundle"]
    types: [completed]
permissions:
  contents: write
  actions: read
concurrency:
  group: obsidian-source-scraper-release
  cancel-in-progress: false
jobs:
  publish:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Require both test suites on the same current main revision
        id: ready
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          node --input-type=module - <<'NODE'
          import {readFileSync,appendFileSync} from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const api=path=>JSON.parse(execFileSync('gh',['api',`repos/${process.env.GITHUB_REPOSITORY}/${path}`],{encoding:'utf8'}));
          const sha=process.env.TESTED_SHA;
          if(api('git/ref/heads/main').object.sha!==sha){console.log('Newer main requires its own tests');process.exit(0);}
          const manifest=JSON.parse(readFileSync('manifest.json','utf8')),pkg=JSON.parse(readFileSync('package.json','utf8'));
          if(manifest.id!=='source-scraper'||manifest.version!==pkg.version||!/^\d+\.\d+\.\d+$/.test(pkg.version))throw Error('Invalid release identity');
          const runs=api(`actions/runs?head_sha=${sha}&event=push&per_page=100`).workflow_runs;
          const latest=name=>runs.filter(r=>r.name===name&&r.head_repository.full_name===process.env.GITHUB_REPOSITORY).sort((a,b)=>b.id-a.id)[0];
          const ci=latest('Plugin CI'),integration=latest('Integration bundle');
          if(ci?.conclusion!=='success'||integration?.conclusion!=='success'){console.log('Both test suites must succeed before publishing; the other completion event will recheck');process.exit(0);}
          const tag=manifest.version,refs=api('git/matching-refs/tags/'+tag).filter(r=>r.ref==='refs/tags/'+tag);
          let target=refs[0]?.object;
          for(let i=0;target?.type==='tag'&&i<8;i++)target=api('git/tags/'+target.sha).object;
          if(target&&target.type!=='commit')throw Error('Tag does not resolve to a commit');
          const releases=JSON.parse(execFileSync('gh',['release','list','--limit','1000','--json','tagName'],{encoding:'utf8'}));
          if(releases.some(r=>r.tagName===tag)){if(!target)throw Error('Published tag missing');console.log('Preserving immutable existing release; bump version for new downloads');process.exit(0);}
          if(target&&target.sha!==sha)throw Error('Existing tag differs from tested commit; choose a new version');
          appendFileSync(process.env.GITHUB_OUTPUT,`publish=true\ntag=${tag}\nintegrationRun=${integration.id}\n`);
          NODE
      - name: Download the exact tested integration bundle
        if: steps.ready.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.ready.outputs.integrationRun }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          gh run download "$RUN_ID" --name source-scraper-integration-bundle --dir dist/integration
          node --input-type=module - <<'NODE'
          import {readFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          const m=JSON.parse(readFileSync('dist/integration/integration.json','utf8'));
          if(m.pluginCommit!==process.env.TESTED_SHA||m.noteWritesSupported!==false)throw Error('Bundle provenance mismatch');
          for(const [path,hash] of Object.entries(m.files)){
            if(!/^(engine|source-scraper|vault-as-mcp)\/[a-z.-]+$/.test(path))throw Error('Invalid bundle path');
            if(createHash('sha256').update(readFileSync('dist/integration/'+path)).digest('hex')!==hash)throw Error('Bundle content mismatch');
          }
          NODE
          cp dist/integration/source-scraper/{main.js,manifest.json,styles.css} dist/
          (cd dist/integration && zip -qr ../source-scraper-integration.zip .)
          (cd dist && sha256sum main.js manifest.json styles.css source-scraper-integration.zip > SHA256SUMS)
      - name: Publish new immutable release and verify downloaded bytes
        if: steps.ready.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ready.outputs.tag }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          current=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')
          test "$current" = "$TESTED_SHA"
          gh release create "$TAG" dist/main.js dist/manifest.json dist/styles.css dist/source-scraper-integration.zip dist/SHA256SUMS \
            --title "Source Scraper for Obsidian $TAG" --target "$TESTED_SHA" --notes-file "docs/releases/$TAG.md"
          actual=$(gh api "repos/${GITHUB_REPOSITORY}/commits/$TAG" --jq '.sha')
          test "$actual" = "$TESTED_SHA"
          mkdir -p verify-release
          gh release download "$TAG" --dir verify-release
          (cd verify-release && sha256sum --check SHA256SUMS)
          cmp dist/SHA256SUMS verify-release/SHA256SUMS
