name: Plugin CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  typecheck-test-build:
    name: Build and protect vault (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - run: npm ci --no-audit --no-fund
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run check
      - run: npm test
      - name: Bounded large-project JSON and Markdown profile
        if: runner.os == 'Linux'
        run: node --experimental-strip-types scripts/bench-import.mjs
      - run: npm run build
      - name: Check standard Obsidian release assets
        shell: bash
        run: |
          test -s main.js
          test -s manifest.json
          test -s styles.css
          node --input-type=module - <<'NODE'
          import {readFileSync} from 'node:fs';
          const manifest=JSON.parse(readFileSync('manifest.json','utf8'));
          const pkg=JSON.parse(readFileSync('package.json','utf8'));
          if(manifest.id!=='source-scraper'||manifest.version!==pkg.version||
             manifest.name!=='Source Scraper'||!manifest.isDesktopOnly){
            throw Error('Manifest identity and package version mismatch');
          }
          const built=readFileSync('main.js','utf8');
          if(built.includes('collector.cjs')||built.includes('~/.x-feed-scraper')){
            throw Error('The standalone plugin must not embed the legacy X collector');
          }
          NODE
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: source-scraper-obsidian-plugin
          path: |
            main.js
            manifest.json
            styles.css
          if-no-files-found: error
          retention-days: 30

  desktop-e2e:
    name: Genuine Obsidian Desktop, isolated vault
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Install desktop acceptance harness
        run: npm install --prefix tests/desktop --no-audit --no-fund
      - name: Prepare virtual Linux display
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb herbstluftwm
          Xvfb :99 -screen 0 1280x1024x24 -nolisten tcp &
          sleep 2
          DISPLAY=:99 herbstluftwm &
          sleep 2
      - name: Import JSON and prove create-only behavior in actual Obsidian
        env:
          DISPLAY: ':99'
          OBSIDIAN_VERSIONS: latest/latest
          WDIO_MAX_INSTANCES: '1'
        run: ./tests/desktop/node_modules/.bin/wdio run ./tests/desktop/wdio.conf.mts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-scraper-desktop-screenshots
          path: tests/desktop/artifacts/
          if-no-files-found: warn
          retention-days: 14

  real-engine-contract:
    name: Consume real Source Scraper JSON v1
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin
      - uses: actions/checkout@v4
        with:
          repository: ibbuilds/source-scraper
          ref: v0.14.0-beta.1
          path: engine
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - run: npm ci --prefix engine --no-audit --no-fund
      - run: npm run build:cli --prefix engine
      - name: Generate a genuine offline engine export
        working-directory: engine
        run: |
          node dist/source-scraper.mjs init --dir ./ci-demo
          node dist/source-scraper.mjs run --config ./ci-demo/project.json
          node dist/source-scraper.mjs export --config ./ci-demo/project.json --out ./real-export.json
      - name: Verify independent plugin can parse and render the real JSON
        run: node --experimental-strip-types plugin/scripts/verify-engine-json.mjs engine/real-export.json
      - name: Execute real CLI bridge, persist review and verify replay
        run: node --experimental-strip-types plugin/scripts/verify-real-cli.mjs engine/dist/source-scraper.mjs engine/ci-demo/project.json

  provider-engine-contract:
    name: Review-only provider with matching engine capabilities
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin
      - uses: actions/checkout@v4
        with:
          repository: ibbuilds/source-scraper
          ref: e7ac0dc3d20f388982354b4b1bfa2e5b5e2561f4
          path: engine
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - run: npm ci --prefix plugin --no-audit --no-fund
      - run: npm ci --prefix engine --no-audit --no-fund
      - run: npm run build:cli --prefix engine
      - name: Verify real provider, assessments, drafts and zero note creation
        run: node --experimental-strip-types plugin/scripts/verify-mcp-provider.mjs engine/dist/source-scraper.mjs

  host-provider-contract:
    name: Reproducible existing MCP host extension
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin
      - uses: actions/checkout@v4
        with:
          repository: ebullient/obsidian-vault-mcp
          ref: 0f801bdb94cbf543a8f303b1ca950f30b2783595
          path: host
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Apply the pinned provider patch
        run: |
          git -C host apply --check ../plugin/compat/vault-as-mcp-1.2.0-provider-api.patch
          git -C host apply ../plugin/compat/vault-as-mcp-1.2.0-provider-api.patch
      - run: npm ci --prefix host --no-audit --no-fund
      - name: Type-check the existing host
        working-directory: host
        run: npx tsc --noEmit
      - run: npm test --prefix host
      - run: npm run build --prefix host
